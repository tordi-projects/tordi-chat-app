{% extends 'base.html' %}
{% block title %}Sign up - Tordi{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-logo">T</div>
    <h1 class="brand">Tordi</h1>
    <p class="subtitle">Simple. Secure. Reliable messaging.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <label for="{{ form.email.id_for_label }}">Email address</label>
      {{ form.email }}
      {% if form.email.errors %}<p class="field-error">{{ form.email.errors.0 }}</p>{% endif %}
      <button type="submit" class="btn-primary">Send code</button>
    </form>
    <p class="switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
